[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-north"
version = "0.1.0"
description = "An open-source numerology research engine."
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]

build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = [
    "src"
]