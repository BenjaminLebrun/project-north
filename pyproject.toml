[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-north"
version = "0.1.0"
description = "An open-source numerology research engine."
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
exclude = [
    "research/*.ipynb"
]

authors = [
    { name = "Benjamin Lebrun" }
]

license = { text = "MIT" }

readme = "README.md"

keywords = [
    "numerology",
    "research",
    "python",
    "open-source"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]